[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "support-insight-agent"
version = "0.2.0"
description = "Auditable product-scoped support insight pipeline"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.38,<2.1", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "pypdf>=6,<7",
  "python-docx>=1.1,<2", "pillow>=11,<13", "PyJWT[crypto]>=2.10,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
docs = ["reportlab>=4.4,<5", "pypdfium2>=4.30,<6", "python-pptx>=1.0,<2"]
[project.scripts]
support-agent = "support_agent.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "support_agent/resources/prompts"
"config" = "support_agent/resources/config"
"fixtures/demo" = "support_agent/resources/fixtures/demo"
"migrations" = "support_agent/resources/migrations"
"alembic.ini" = "support_agent/resources/alembic.ini"
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
