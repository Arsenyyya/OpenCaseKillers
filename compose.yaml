name: support-insight
x-app: &app
  image: support-insight-agent:local
  build: .
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://agent_worker:${WORKER_PASSWORD}@db:5432/agent
    DATABASE_ADMIN_URL: postgresql+psycopg://agent_owner:${POSTGRES_PASSWORD}@db:5432/agent
    STORAGE_DIR: /app/.local/storage
  volumes:
    - agent-storage:/app/.local
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: agent_owner
      POSTGRES_DB: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WORKER_PASSWORD: ${WORKER_PASSWORD}
      API_PASSWORD: ${API_PASSWORD}
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_owner -d agent"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["support-agent", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  ingest:
    <<: *app
    command: ["support-agent", "ingest"]
  media:
    <<: *app
    command: ["support-agent", "worker", "media"]
  media-text:
    <<: *app
    command: ["support-agent", "worker", "media_text"]
  analysis:
    <<: *app
    command: ["support-agent", "worker", "analysis"]
  delivery:
    <<: *app
    command: ["support-agent", "api", "--host", "0.0.0.0"]
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://agent_api:${API_PASSWORD}@db:5432/agent
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 4
  sender:
    <<: *app
    command: ["support-agent", "worker", "delivery"]
  scheduler:
    <<: *app
    command: ["support-agent", "scheduler"]
volumes:
  pgdata:
  agent-storage:
